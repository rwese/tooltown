services:
  web:
    image: "${TOOLTOWN_IMAGE:-ghcr.io/rwese/tooltown:latest}"
    restart: "${TOOLTOWN_RESTART_POLICY:-unless-stopped}"
    environment:
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-tooltown}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=rwese,deployment.environment=production}"
    labels:
      - "traefik.enable=${TOOLTOWN_TRAEFIK_ENABLED:-true}"
      - "traefik.http.routers.${TOOLTOWN_TRAEFIK_ROUTER:-tooltown}.rule=Host(`${TOOLTOWN_HOST:-tooltown.void.cold.at}`)"
      - "traefik.http.routers.${TOOLTOWN_TRAEFIK_ROUTER:-tooltown}.entrypoints=${TOOLTOWN_TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${TOOLTOWN_TRAEFIK_ROUTER:-tooltown}.tls=${TOOLTOWN_TRAEFIK_TLS:-true}"
      - "traefik.http.services.${TOOLTOWN_TRAEFIK_SERVICE:-tooltown}.loadbalancer.server.port=${TOOLTOWN_CONTAINER_PORT:-8080}"
      - "managed-by=${TOOLTOWN_MANAGED_BY:-apps}"
      - "com.centurylinklabs.watchtower.enable=${TOOLTOWN_WATCHTOWER_ENABLED:-true}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
